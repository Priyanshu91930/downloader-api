<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>btch-downloader-api · endpoint tester</title>
<style>
  :root {
    --bg: #0b0f0e;
    --panel: #101614;
    --line: #1f2b27;
    --text: #dce8e3;
    --muted: #6f8680;
    --accent: #3ddc97;
    --accent-dim: #234a3b;
    --error: #ff6b5e;
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace;
    --sans: "Inter", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  img, svg, pre, select, input, .endpoint-line {
    max-width: 100%;
  }

  html { -webkit-text-size-adjust: 100%; }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    width: 100%;
    padding: clamp(24px, 6vw, 48px) clamp(14px, 4vw, 20px) 80px;
  }

  header {
    margin-bottom: 32px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 24px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }

  h1 {
    font-size: clamp(20px, 5vw, 26px);
    margin: 0 0 8px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  header p {
    color: var(--muted);
    margin: 0;
    font-size: clamp(13px, 3.5vw, 14px);
    line-height: 1.6;
  }

  .status-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
  }
  .dot.up { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.down { background: var(--error); box-shadow: 0 0 8px var(--error); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: clamp(16px, 4vw, 24px);
    margin-bottom: 20px;
    width: 100%;
  }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  select, input {
    width: 100%;
    max-width: 100%;
    background: #0d1412;
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 7px;
    font-family: var(--mono);
    /* 16px minimum stops iOS Safari from auto-zooming the page on focus */
    font-size: 16px;
    outline: none;
    transition: border-color 0.15s ease;
    -webkit-appearance: none;
    appearance: none;
  }

  select:focus, input:focus {
    border-color: var(--accent);
  }

  .row { margin-bottom: 16px; }

  .example {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  button {
    width: 100%;
    background: var(--accent);
    color: #06110d;
    border: none;
    padding: 13px;
    border-radius: 7px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .endpoint-line {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    background: #0d1412;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 10px 12px;
    margin-top: 14px;
    word-break: break-all;
  }
  .endpoint-line .method { color: var(--accent); font-weight: 600; }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  .result-header h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0;
    font-family: var(--mono);
  }

  .badge {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid var(--line);
  }
  .badge.ok { color: var(--accent); border-color: var(--accent-dim); background: rgba(61,220,151,0.08); }
  .badge.err { color: var(--error); border-color: #4a2622; background: rgba(255,107,94,0.08); }

  pre {
    background: #0d1412;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 14px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    font-family: var(--mono);
    font-size: clamp(11.5px, 3vw, 12.5px);
    line-height: 1.6;
    margin: 0;
    max-width: 100%;
    max-height: min(420px, 55vh);
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .empty-state {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
    text-align: center;
    padding: 20px 0;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    margin-top: 40px;
  }
  footer a { color: var(--accent); text-decoration: none; }

  /* Small phones: tighten spacing further and let the footer link wrap cleanly */
  @media (max-width: 420px) {
    .wrap { padding-bottom: 56px; }
    header { margin-bottom: 24px; padding-bottom: 18px; }
    .badge { font-size: 10.5px; padding: 3px 8px; }
    footer { padding: 0 4px; word-break: break-word; }
  }

  /* Short/landscape viewports: don't let the JSON panel eat the whole screen */
  @media (max-height: 480px) {
    pre { max-height: 40vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  .media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  .media-card {
    background: #0d1412;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .media-card img,
  .media-card video {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    display: block;
    background: #000;
  }

  .media-card audio {
    width: 100%;
    display: block;
    margin: 12px;
    max-width: calc(100% - 24px);
  }

  .media-card-body {
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .media-card-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
  }

  .media-download-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: var(--mono);
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .media-download-btn:hover {
    background: var(--accent);
    color: #06120d;
  }

  .media-download-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .media-download-status {
    font-family: var(--mono);
    font-size: 11px;
    color: #ff6b6b;
    word-break: break-word;
  }

  .media-empty {
    color: var(--muted);
    font-size: 13px;
    padding: 4px 0;
  }
  .switch-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }

  .switch {
    position: relative;
    display: inline-block;
    width: 36px;
    height: 20px;
  }

  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .switch-track {
    position: absolute;
    inset: 0;
    background: #1b2622;
    border: 1px solid var(--line);
    border-radius: 20px;
    transition: background 0.15s ease;
  }

  .switch-track::before {
    content: "";
    position: absolute;
    height: 14px;
    width: 14px;
    left: 2px;
    top: 2px;
    background: var(--muted);
    border-radius: 50%;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .switch input:checked + .switch-track {
    background: var(--accent-dim);
    border-color: var(--accent);
  }

  .switch input:checked + .switch-track::before {
    transform: translateX(16px);
    background: var(--accent);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">// btch-downloader-api</p>
      <h1>Endpoint tester</h1>
      <p>Pick a platform, paste a public URL (or search query), and fetch the raw JSON response the API returns.</p>
      <div class="status-row">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">checking server…</span>
      </div>
    </header>

    <div class="panel">
      <div class="row">
        <label for="platform">Platform</label>
        <select id="platform"></select>
      </div>

      <div class="row">
        <label for="input" id="inputLabel">Url</label>
        <input id="input" type="text" placeholder="Paste a link here…" autocomplete="off" />
        <p class="example" id="exampleText"></p>
      </div>

      <button id="fetchBtn">Fetch</button>

      <div class="endpoint-line" id="endpointLine"></div>
    </div>

    <div class="panel">
      <div class="result-header">
        <h2>Media</h2>
        <span class="badge" id="resultBadge" style="display:none;"></span>
      </div>
      <div id="mediaCards"><span class="empty-state">No request made yet.</span></div>
    </div>

    <div class="panel" id="rawResponsePanel">
      <div class="result-header">
        <h2>Raw response</h2>
        <label class="switch-label">
          <span>Show</span>
          <span class="switch">
            <input type="checkbox" id="rawToggle" />
            <span class="switch-track"></span>
          </span>
        </label>
      </div>
      <pre id="resultBox" style="display:none;"><span class="empty-state">No request made yet.</span></pre>
    </div>

    <footer>Local dev tester · calls <a href="/api/platforms" target="_blank">/api/platforms</a> and <a href="/api/health" target="_blank">/api/health</a></footer>
  </div>

<script>
  const platformSelect = document.getElementById("platform");
  const inputEl = document.getElementById("input");
  const inputLabel = document.getElementById("inputLabel");
  const exampleText = document.getElementById("exampleText");
  const fetchBtn = document.getElementById("fetchBtn");
  const endpointLine = document.getElementById("endpointLine");
  const resultBox = document.getElementById("resultBox");
  const rawToggle = document.getElementById("rawToggle");

  rawToggle.addEventListener("change", () => {
    resultBox.style.display = rawToggle.checked ? "block" : "none";
  });
  const resultBadge = document.getElementById("resultBadge");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");

  let platforms = {};

  // Ordered so a more specific host match wins before a looser one.
  const DETECT_PATTERNS = [
    [/tiktok\.com/i, "tiktok"],
    [/instagram\.com/i, "instagram"],
    [/(facebook\.com|fb\.watch)/i, "facebook"],
    [/(twitter\.com|x\.com)/i, "twitter"],
    [/(youtube\.com|youtu\.be)/i, "youtube"],
    [/open\.spotify\.com/i, "spotify"],
    [/soundcloud\.com/i, "soundcloud"],
    [/(pinterest\.[a-z.]+|pin\.it)/i, "pinterest"],
    [/mediafire\.com/i, "mediafire"],
    [/drive\.google\.com/i, "gdrive"],
    [/capcut\.com/i, "capcut"],
    [/douyin\.com/i, "douyin"],
    [/(xiaohongshu\.com|xhslink\.com)/i, "xiaohongshu"],
    [/snackvideo\.com/i, "snackvideo"],
    [/(icocofun\.com|cocofun\.com)/i, "cocofun"],
  ];

  function detectPlatform(value) {
    const v = String(value || '').trim();
    if (!v) return null;
    // Allow pasted links without a protocol (e.g. "youtube.com/...") by
    // prepending a dummy http:// when testing patterns.
    const testValue = /^https?:\/\//i.test(v) ? v : 'http://' + v;

    for (const [pattern, key] of DETECT_PATTERNS) {
      if (pattern.test(testValue) && platforms[key]) return key;
    }
    return null;
  }

  function maybeAutoSelect() {
    const detected = detectPlatform(inputEl.value);
    if (detected && platformSelect.value !== detected) {
      platformSelect.value = detected;
      updateInputUI();
    }
  }

  function paramName(queryType) {
    return queryType === "query" ? "query" : "url";
  }

  function updateInputUI() {
    const key = platformSelect.value;
    const cfg = platforms[key];
    if (!cfg) return;
    const p = paramName(cfg.queryType);
    inputLabel.textContent = cfg.queryType === "url_or_query" ? "Url or search query" : p === "query" ? "Search query" : "Url";
    inputEl.placeholder = cfg.example;
    exampleText.textContent = "e.g. " + cfg.example;
    updateEndpointLine();
  }

  function updateEndpointLine() {
    const key = platformSelect.value;
    const cfg = platforms[key];
    if (!cfg) return;
    const p = paramName(cfg.queryType);
    const val = inputEl.value.trim() || `{${p}}`;
    endpointLine.innerHTML = `<span class="method">GET</span> /api/download/${key}?${p}=${encodeURIComponent(val)}`;
  }

  async function loadPlatforms() {
    try {
      const res = await fetch("/api/platforms");
      const data = await res.json();
      platforms = Object.fromEntries(data.platforms.map((p) => [p.key, p]));
      const keys = Object.keys(platforms);
      platformSelect.innerHTML = keys
        .map((key) => `<option value="${key}">${key}</option>`)
        .join("");
      // Ensure a sensible default is selected (first platform) so auto-detect can set correctly.
      if (!keys.includes(platformSelect.value)) platformSelect.value = keys[0] || "";
      updateInputUI();
      // Try auto-selecting now in case the user pasted before platforms finished loading.
      maybeAutoSelect();
    } catch (err) {
      endpointLine.textContent = "Could not load platform list — is the server running?";
    }
  }

  async function checkHealth() {
    try {
      const res = await fetch("/api/health");
      if (res.ok) {
        statusDot.classList.add("up");
        statusText.textContent = "server online";
      } else {
        throw new Error();
      }
    } catch {
      statusDot.classList.add("down");
      statusText.textContent = "server unreachable";
    }
  }

  const mediaCards = document.getElementById("mediaCards");

  const VIDEO_EXT = /\.(mp4|webm|mov|m4v)(\?|$)/i;
  const AUDIO_EXT = /\.(mp3|m4a|aac|ogg|wav)(\?|$)/i;
  const IMAGE_EXT = /\.(jpe?g|png|gif|webp)(\?|$)/i;

  function classifyMedia(key, url) {
    const k = String(key || "").toLowerCase();
    if (VIDEO_EXT.test(url) || /video/.test(k)) return "video";
    if (AUDIO_EXT.test(url) || /(audio|music|song)/.test(k)) return "audio";
    if (IMAGE_EXT.test(url) || /(image|thumb|photo|cover)/.test(k)) return "image";
    return "file";
  }

  // Walks the JSON result and collects every string that looks like a
  // downloadable media URL, tagged with the key it was found under so we
  // can guess its type (video/audio/image) for rendering.
  function collectMediaUrls(node, keyHint, out) {
    if (node == null) return;
    if (typeof node === "string") {
      if (/^https?:\/\/\S+$/i.test(node)) {
        out.push({ key: keyHint || "media", url: node });
      }
      return;
    }
    if (Array.isArray(node)) {
      node.forEach((item) => collectMediaUrls(item, keyHint, out));
      return;
    }
    if (typeof node === "object") {
      for (const [k, v] of Object.entries(node)) {
        collectMediaUrls(v, k, out);
      }
    }
  }

  function renderMediaCards(data) {
    mediaCards.innerHTML = "";

    if (!data || !data.success || !data.result) {
      mediaCards.innerHTML = '<div class="media-empty">No media to show.</div>';
      return;
    }

    const found = [];
    collectMediaUrls(data.result, null, found);

    // De-dupe by URL — many platforms repeat the same link under a couple of keys.
    const seen = new Set();
    const unique = found.filter((f) => {
      if (seen.has(f.url)) return false;
      seen.add(f.url);
      return true;
    });

    if (!unique.length) {
      mediaCards.innerHTML = '<div class="media-empty">No downloadable links found in this response.</div>';
      return;
    }

    const grid = document.createElement("div");
    grid.className = "media-grid";

    unique.forEach((item, i) => {
      const type = classifyMedia(item.key, item.url);
      const card = document.createElement("div");
      card.className = "media-card";

      let previewHtml = "";
      if (type === "video") {
        previewHtml = `<video src="${item.url}" controls preload="metadata"></video>`;
      } else if (type === "audio") {
        previewHtml = `<audio src="${item.url}" controls></audio>`;
      } else if (type === "image") {
        previewHtml = `<img src="${item.url}" loading="lazy" alt="${item.key}" />`;
      }

      // Base filename only — the server determines the *real* extension from
      // the actual Content-Type it gets back, since URLs (e.g. YouTube's
      // googlevideo.com links) often carry no extension at all.
      const filenameBase = (data.platform || "media") + "-" + (i + 1);
      const proxyUrl = `/api/fetch-media?url=${encodeURIComponent(item.url)}&filename=${encodeURIComponent(filenameBase)}`;

      const cardId = `media-card-${i}`;
      card.id = cardId;
      card.innerHTML = `
        ${previewHtml}
        <div class="media-card-body">
          <div class="media-card-label">${item.key} · ${type}</div>
          <button type="button" class="media-download-btn" data-proxy-url="${proxyUrl}">⬇ Download</button>
          <div class="media-download-status" style="display:none;"></div>
        </div>
      `;
      grid.appendChild(card);
    });

    mediaCards.appendChild(grid);

    // JS-driven download instead of a plain <a download> link: a bare link
    // can't tell the difference between a real file and an upstream error
    // page — it just saves whatever bytes come back. Fetching first lets us
    // check the response actually succeeded, use the server's real filename
    // (correct extension), and show a clear error instead of silently
    // handing over a broken file.
    mediaCards.querySelectorAll(".media-download-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const proxyUrl = btn.dataset.proxyUrl;
        const statusEl = btn.nextElementSibling;
        const originalLabel = btn.textContent;

        btn.disabled = true;
        btn.textContent = "Downloading…";
        statusEl.style.display = "none";

        try {
          const res = await fetch(proxyUrl);
          if (!res.ok) {
            let message = `Download failed (${res.status})`;
            try {
              const errBody = await res.json();
              if (errBody?.message) message = errBody.message;
            } catch {
              // response wasn't JSON — keep the generic message
            }
            throw new Error(message);
          }

          const disposition = res.headers.get("content-disposition") || "";
          const nameMatch = disposition.match(/filename="([^"]+)"/);
          const filename = nameMatch ? nameMatch[1] : "download";

          const blob = await res.blob();
          const objectUrl = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = objectUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(objectUrl);

          btn.textContent = "✔ Saved";
          setTimeout(() => {
            btn.textContent = originalLabel;
            btn.disabled = false;
          }, 1500);
        } catch (err) {
          statusEl.textContent = String(err.message || err);
          statusEl.style.display = "block";
          btn.textContent = originalLabel;
          btn.disabled = false;
        }
      });
    });
  }

  async function runFetch() {
    const key = platformSelect.value;
    const cfg = platforms[key];
    const value = inputEl.value.trim();

    if (!value) {
      inputEl.focus();
      return;
    }

    fetchBtn.disabled = true;
    fetchBtn.textContent = "Fetching…";
    resultBadge.style.display = "none";
    resultBox.innerHTML = '<span class="empty-state">Loading…</span>';

    const p = paramName(cfg.queryType);
    const url = `/api/download/${key}?${p}=${encodeURIComponent(value)}`;

    try {
      const res = await fetch(url);
      const data = await res.json();

      resultBadge.style.display = "inline-block";
      resultBadge.textContent = res.status + (data.success ? " success" : " error");
      resultBadge.className = "badge " + (data.success ? "ok" : "err");

      resultBox.textContent = JSON.stringify(data, null, 2);
      renderMediaCards(data);
    } catch (err) {
      resultBadge.style.display = "inline-block";
      resultBadge.textContent = "network error";
      resultBadge.className = "badge err";
      resultBox.textContent = String(err);
      mediaCards.innerHTML = "";
    } finally {
      fetchBtn.disabled = false;
      fetchBtn.textContent = "Fetch";
    }
  }

  platformSelect.addEventListener("change", updateInputUI);
  inputEl.addEventListener("input", () => {
    maybeAutoSelect();
    updateEndpointLine();
  });
  // Ensure pasted content triggers detection after the input value is updated by the browser.
  inputEl.addEventListener("paste", () => setTimeout(() => { maybeAutoSelect(); updateEndpointLine(); }, 0));
  // Also handle drops onto the input (drag & drop)
  inputEl.addEventListener("drop", () => setTimeout(() => { maybeAutoSelect(); updateEndpointLine(); }, 0));
  inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") runFetch(); });
  fetchBtn.addEventListener("click", runFetch);

  loadPlatforms();
  checkHealth();
</script>
</body>
</html>
